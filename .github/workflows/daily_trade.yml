name: 🤖 Scheduled Paper Trading Bot

on:
  schedule:
    - cron: '15 10 * * 1-5'
      timezone: 'America/New_York'
    - cron: '15 16 * * 1-5'
      timezone: 'America/New_York'
    # Pre-close cleanup of fractional stock/ETF positions whose DAY stops expire at the close.
    # 15:40 covers a normal 16:00 close; 12:40 covers a 13:00 early close and is a no-op otherwise
    # (the bot consults Alpaca's clock and only acts inside FRACTIONAL_EOD_WINDOW_MINUTES).
    - cron: '40 15 * * 1-5'
      timezone: 'America/New_York'
    - cron: '40 12 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode for the paper-trading bot
        required: true
        default: report
        type: choice
        options:
          - report
          - trade
          - eod

permissions:
  contents: write       # needed to push README + data files back to repo

# Opt into Node.js 24 now — Node.js 20 actions are deprecated and will be
# removed from runners on 2026-09-16 (forced default from 2026-06-02).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: alpaca-paper-trading-bot
  cancel-in-progress: false

jobs:
  scheduled-trade:
    name: Scheduled Trade Run
    if: github.event_name == 'schedule' && github.event.schedule == '15 10 * * 1-5' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️  Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍  Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: 📦  Install dependencies
        run: pip install -r requirements.txt

      - name: ✅ Run tests
        run: python -m pytest -q

      - name: 🚀  Run scheduled trade mode
        id: run_bot
        continue-on-error: true
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER:      'true'
          PORTFOLIO_SIZE:    '100'
          MAX_POSITION_PERCENT: '10'
          MAX_DAILY_LOSS_PERCENT: '2'
          MAX_DAILY_TRADES: '3'
          MAX_TOTAL_EXPOSURE_PERCENT: '80'
          FRACTIONAL_EQUITY_THRESHOLD: '20000'
          FRACTIONAL_EOD_WINDOW_MINUTES: '30'
          ALLOW_MARGIN:      'false'
          ALLOW_SHORTS:      'false'
          SENDER_EMAIL:      ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD:   ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL:   ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER:       'smtp.gmail.com'
          SMTP_PORT:         '587'
          EMAIL_REQUIRED:    'true'
        run: python -m src.main --mode trade --scheduled-run

      - name: 📊  Commit updated dashboard & portfolio state
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          for file in README.md data/portfolio_state.json data/trade_log.csv reports/daily_summary.md; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          git diff --staged --quiet \
            || git commit -m "📊 [bot] Portfolio dashboard — $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: ❌  Fail job if scheduled trade mode failed
        if: steps.run_bot.outcome == 'failure'
        run: exit 1

  scheduled-report:
    name: Scheduled Report Run
    if: github.event_name == 'schedule' && github.event.schedule == '15 16 * * 1-5' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️  Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍  Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: 📦  Install dependencies
        run: pip install -r requirements.txt

      - name: ✅ Run tests
        run: python -m pytest -q

      - name: 📨 Run scheduled report mode
        id: run_bot
        continue-on-error: true
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER:      'true'
          PORTFOLIO_SIZE:    '100'
          MAX_POSITION_PERCENT: '10'
          MAX_DAILY_LOSS_PERCENT: '2'
          MAX_DAILY_TRADES: '3'
          MAX_TOTAL_EXPOSURE_PERCENT: '80'
          FRACTIONAL_EQUITY_THRESHOLD: '20000'
          FRACTIONAL_EOD_WINDOW_MINUTES: '30'
          ALLOW_MARGIN:      'false'
          ALLOW_SHORTS:      'false'
          SENDER_EMAIL:      ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD:   ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL:   ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER:       'smtp.gmail.com'
          SMTP_PORT:         '587'
          EMAIL_REQUIRED:    'true'
        run: python -m src.main --mode report --scheduled-run

      - name: 📊  Commit updated dashboard & portfolio state
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          for file in README.md data/portfolio_state.json data/trade_log.csv reports/daily_summary.md; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          git diff --staged --quiet \
            || git commit -m "📊 [bot] Portfolio dashboard — $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: ❌  Fail job if scheduled report mode failed
        if: steps.run_bot.outcome == 'failure'
        run: exit 1

  scheduled-eod:
    name: Scheduled Fractional EOD Cleanup
    if: github.event_name == 'schedule' && (github.event.schedule == '40 15 * * 1-5' || github.event.schedule == '40 12 * * 1-5') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️  Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍  Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: 📦  Install dependencies
        run: pip install -r requirements.txt

      - name: ✅ Run tests
        run: python -m pytest -q

      - name: 🧹 Run scheduled EOD cleanup mode
        id: run_bot
        continue-on-error: true
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER:      'true'
          PORTFOLIO_SIZE:    '100'
          MAX_POSITION_PERCENT: '10'
          MAX_DAILY_LOSS_PERCENT: '2'
          MAX_DAILY_TRADES: '3'
          MAX_TOTAL_EXPOSURE_PERCENT: '80'
          FRACTIONAL_EQUITY_THRESHOLD: '20000'
          FRACTIONAL_EOD_WINDOW_MINUTES: '30'
          ALLOW_MARGIN:      'false'
          ALLOW_SHORTS:      'false'
        run: python -m src.main --mode eod --scheduled-run

      - name: 📊  Commit updated dashboard & portfolio state
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          for file in README.md data/portfolio_state.json data/trade_log.csv reports/daily_summary.md; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          git diff --staged --quiet \
            || git commit -m "🧹 [bot] Fractional EOD cleanup — $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      # A failed cleanup means a fractional position may be unprotected overnight: fail loudly.
      - name: ❌  Fail job if scheduled EOD cleanup failed
        if: steps.run_bot.outcome == 'failure'
        run: exit 1

  manual-run:
    name: Manual Paper Bot Run
    if: github.event_name == 'workflow_dispatch' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️  Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍  Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: 📦  Install dependencies
        run: pip install -r requirements.txt

      - name: ✅ Run tests
        run: python -m pytest -q

      - name: ▶️  Run manually selected bot mode
        id: run_bot
        continue-on-error: true
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER:      'true'
          PORTFOLIO_SIZE:    '100'
          MAX_POSITION_PERCENT: '10'
          MAX_DAILY_LOSS_PERCENT: '2'
          MAX_DAILY_TRADES: '3'
          MAX_TOTAL_EXPOSURE_PERCENT: '80'
          FRACTIONAL_EQUITY_THRESHOLD: '20000'
          FRACTIONAL_EOD_WINDOW_MINUTES: '30'
          ALLOW_MARGIN:      'false'
          ALLOW_SHORTS:      'false'
          SENDER_EMAIL:      ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD:   ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL:   ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER:       'smtp.gmail.com'
          SMTP_PORT:         '587'
          EMAIL_REQUIRED:    'true'
        run: python -m src.main --mode ${{ inputs.mode }}

      - name: 📊  Commit updated dashboard & portfolio state
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          for file in README.md data/portfolio_state.json data/trade_log.csv reports/daily_summary.md; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          git diff --staged --quiet \
            || git commit -m "📊 [bot] Portfolio dashboard — $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: ❌  Fail job if manual bot run failed
        if: steps.run_bot.outcome == 'failure'
        run: exit 1

